<!doctype html><html lang="en"><meta charset="utf-8"><title>MindGym mobile viewport QA</title><style>body{background:#d8ddce;font:14px system-ui;color:#203c33;margin:20px}iframe{display:block;width:390px;height:844px;border:1px solid #98a28c;background:#f3f1e9}button{padding:10px;margin:0 6px 15px 0}</style><h1>Responsive viewport check</h1><p>Real app at a narrow layout viewport. This is not a physical phone or a mobile browser engine.</p><button data-width="320">320px</button><button data-width="390">390px</button><button data-width="768">768px</button><iframe title="Mobile MindGym" src="../dist/index.html"></iframe><script>const f=document.querySelector('iframe');let target=390;function fit(){f.style.width=target+'px';requestAnimationFrame(()=>{const gap=target-f.contentDocument.documentElement.clientWidth;f.style.width=(target+Math.max(0,gap))+'px';});}f.onload=fit;document.querySelectorAll('button').forEach(b=>b.onclick=()=>{target=Number(b.dataset.width);fit();});</script></html>
